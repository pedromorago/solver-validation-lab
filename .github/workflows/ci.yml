name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Cache the three-way equity table
        id: threeway
        uses: actions/cache@v4
        with:
          path: src/svlab/data/threeway_equity.bin
          key: threeway-${{ hashFiles('tools/threeway_equity.c', 'tools/poker.h', 'scripts/make_threeway_table.py') }}
      - name: Build the three-way equity table
        if: steps.threeway.outputs.cache-hit != 'true'
        run: python scripts/make_threeway_table.py
        env:
          PYTHONPATH: src:.
      - name: Tests
        run: pytest -q
      - name: Seeded bugs report
        run: |
          python scripts/run_mutants.py | tee mutants.md
          cat mutants.md >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: src:.
      - name: Validate the strategy fixtures
        run: svlab validate fixtures/strategies/*.json
      - name: Suit isomorphism across files
        run: svlab iso fixtures/strategies/srp_btn_bb_Ks7s2d.json fixtures/strategies/srp_btn_bb_Kh7h2c.json
      - name: Regression diff demo
        run: |
          svlab diff fixtures/strategies/srp_btn_bb_Ks7s2d.json fixtures/strategies/candidate_minor_Ks7s2d.json \
            --config fixtures/diff_thresholds.json --quiet
          # The regressed candidate must fail the diff with exit code 1.
          set +e
          svlab diff fixtures/strategies/srp_btn_bb_Ks7s2d.json fixtures/strategies/candidate_regressed_Ks7s2d.json \
            --config fixtures/diff_thresholds.json --markdown diff.md --json diff.json --quiet
          code=$?
          set -e
          test "$code" -eq 1
          { echo "## Regression diff demo (expected to fail)"; echo; cat diff.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Seeded corruptions report
        run: |
          python scripts/run_corruptions.py | tee corruptions.md
          { echo "## Seeded strategy corruptions"; echo; cat corruptions.md; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: src:.
      - name: Push/fold demo
        run: svlab pushfold --stack 10 --json pushfold.json
      - name: Push/fold seeded bugs report
        run: |
          python scripts/run_pushfold_mutants.py | tee pushfold.md
          { echo "## Seeded bugs in the push/fold solver"; echo; cat pushfold.md; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: src:.
      - name: Three-handed push/fold demo
        run: svlab pushfold3 --stack 10 --json pushfold3.json
