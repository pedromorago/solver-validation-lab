name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Seeded bugs report
        run: |
          python scripts/run_mutants.py | tee mutants.md
          cat mutants.md >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: src:.
