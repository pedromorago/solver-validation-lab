[project]
name = "solver-validation-lab"
version = "0.3.0"
description = "Testing poker outputs when there is no perfect oracle: an equity engine, a validator for exported solver strategies and a push/fold solver checked by best responses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Morago" }]
dependencies = ["numpy>=1.26"]

[project.scripts]
svlab = "svlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "treys==0.1.8"]

[tool.setuptools.package-data]
svlab = ["data/*.gz"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: runs the whole suite once per seeded bug"]
