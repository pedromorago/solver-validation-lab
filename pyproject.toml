[project]
name = "solver-validation-lab"
version = "0.2.0"
description = "Testing poker outputs when there is no perfect oracle: an equity engine and a validator for exported solver strategies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Morago" }]
dependencies = []

[project.scripts]
svlab = "svlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "treys==0.1.8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: runs the whole suite once per seeded bug"]
